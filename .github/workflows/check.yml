name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every commit gets a run of its own, and a newer push never cancels one
# that is under way: each commit is checked to the end.
concurrency:
  group: check-${{ github.sha }}
  cancel-in-progress: false

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  clang:
    name: clang ${{ matrix.llvm }}, libc++
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        llvm: [23]
    steps:
      # The whole history, so that each file's time can be the time of the
      # commit that last changed it (below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The build directory and the fetched sources kept between runs. ninja
      # decides what to rebuild from the times of files, and a checkout
      # stamps every file with now -- so each file is given the time of the
      # last commit that changed it, and what a run restores is only rebuilt
      # where something it was built from changed since.
      - name: file times from the history
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            when=$(git log -1 --format=%ct -- "$file")
            [ -n "$when" ] && touch -d "@$when" "$file"
          done

      # Clang and libc++, which is where `import std` comes from.
      - name: clang and libc++
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build lsb-release software-properties-common gnupg curl
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y libc++-${{ matrix.llvm }}-dev libc++abi-${{ matrix.llvm }}-dev libclang-rt-${{ matrix.llvm }}-dev

      - name: cmake
        run: |
          version=4.4.3
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          sudo tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      # CMake works out where the std module's source is from where the
      # compiler is, and the compiler a distribution installs is a link in a
      # directory that says nothing about its toolchain: the answer is
      # /lib/share/libc++/v1, which no package fills. So both ends are said
      # outright.
      - name: where import std is read from
        run: |
          sudo mkdir -p /lib/share/libc++
          sudo ln -sfn /usr/lib/llvm-${{ matrix.llvm }}/share/libc++/v1 /lib/share/libc++/v1
          sudo ln -sf /usr/lib/llvm-${{ matrix.llvm }}/bin/clang++ /usr/local/bin/clang++
          test -f /lib/share/libc++/v1/std.cppm

      # A nightly compiler cannot read a previous build's module binaries.
      - name: compiler and standard library identity
        run: |
          digest=$({ /usr/local/bin/clang++ --version; sha256sum /lib/share/libc++/v1/std.cppm; } | sha256sum | cut -c1-16)
          echo "COMPILER_BUILD=$digest" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            build
            .cache/cpm
          key: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-

      # alef is private: where the ALEF_TOKEN secret is there, git reads
      # github.com/j4niwzis/alef with it, and cairn.precis is built on it.
      - name: alef, where it can be read
        env:
          ALEF_TOKEN: ${{ secrets.ALEF_TOKEN }}
        run: |
          if [ -n "$ALEF_TOKEN" ]; then
            git config --global url."https://x-access-token:${ALEF_TOKEN}@github.com/j4niwzis/alef".insteadOf "https://github.com/j4niwzis/alef"
            echo "CAIRN_UNICODE=ON" >> "$GITHUB_ENV"
          else
            echo "CAIRN_UNICODE=OFF" >> "$GITHUB_ENV"
          fi

      - name: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCAIRN_UNICODE=${{ env.CAIRN_UNICODE }} \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCAIRN_CONSTEXPR_STEPS=2000000000 \
            -DCAIRN_BENCHMARKS=ON \
            -DCAIRN_FUZZ=ON \
            -DCAIRN_LIVE_TESTS=ON
          cmake --build build

      # A real server for the live test: Ergo, its default configuration, on
      # 127.0.0.1:6667.
      - name: ergo
        run: |
          version=2.14.0
          curl -sSL -o /tmp/ergo.tgz "https://github.com/ergochat/ergo/releases/download/v${version}/ergo-${version}-linux-x86_64.tar.gz"
          mkdir -p /tmp/ergo && tar xzf /tmp/ergo.tgz -C /tmp/ergo --strip-components=1
          cd /tmp/ergo
          cp default.yaml ircd.yaml
          ./ergo mkcerts --conf ircd.yaml
          ./ergo initdb --conf ircd.yaml
          nohup ./ergo run --conf ircd.yaml > ergo.log 2>&1 &
          for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/6667) 2>/dev/null && break; sleep 0.2; done

      - name: test
        run: ctest --test-dir build --output-on-failure

      # A minute of fuzzing the parser, from a few lines of each shape.
      - name: fuzz
        run: |
          mkdir -p fuzz/corpus
          printf '@a=b\\sc;d :n!u@h PRIVMSG #x :hi there\r\n' > fuzz/corpus/tags
          printf ':srv 005 me CASEMAPPING=ascii :are supported\r\n' > fuzz/corpus/numeric
          printf 'CAP * LS * :sasl=PLAIN,EXTERNAL batch\r\n' > fuzz/corpus/cap
          printf 'CHATHISTORY BETWEEN #x msgid=a timestamp=2019-01-04T14:33:26.123Z 10\r\n' > fuzz/corpus/history
          printf 'PRIVMSG #x :\001ACTION waves\001\r\n' > fuzz/corpus/ctcp
          ./build/cairn-parse-fuzz -max_total_time=60 -max_len=1024 fuzz/corpus
